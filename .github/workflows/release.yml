name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Package
        id: package
        run: |
          archive="ve-${GITHUB_REF_NAME}-macos-universal.tar.gz"
          tar -czf "$archive" -C .build/apple/Products/Release ve
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$archive" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.archive }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
            --notes "sha256: \`${{ steps.package.outputs.sha256 }}\`"
